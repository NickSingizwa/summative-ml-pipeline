# Round-robin load balancer for the api containers.
# nginx looks up the replicas when it starts, so restart it after scaling:
#   docker compose up -d --scale api=N && docker compose restart lb
worker_processes auto;
events { worker_connections 4096; }

http {
    client_max_body_size 700m;
    log_format timed '$remote_addr "$request" $status $request_time $upstream_addr';
    access_log /var/log/nginx/access.log timed;

    upstream api_pool {
        server api:8000;
        keepalive 64;
    }

    server {
        listen 80;
        location / {
            proxy_pass http://api_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_request_buffering off;
        }
    }
}
